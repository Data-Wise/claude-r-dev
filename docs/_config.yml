# Jekyll configuration for GitHub Pages
title: claude-r-dev
description: Supercharge R package development with AI-powered workflows using Claude Code
baseurl: /claude-r-dev
url: https://data-wise.github.io

# Theme
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

# Defaults for pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
